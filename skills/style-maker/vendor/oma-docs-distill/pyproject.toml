[project]
name = "oma-docs-distill"
version = "0.1.0"
description = "Distill multiple Markdown documents into a maintainable Agent Skill."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jieba>=0.42.1",
  "langgraph>=0.6.0",
  "openai>=1.99.0",
  "httpx>=0.28.0",
  "jinja2>=3.1.6",
  "socksio>=1.0.0",
  "pydantic>=2.11.0",
  "python-dotenv>=1.1.0",
]

[project.scripts]
distill-agent = "distill_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["distill_agent"]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
